name: TakyonDB CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast false: every OS reports even when another fails.
      fail-fast: false
      matrix:
        # macos-15 (not -latest): Zig 0.14.1 predates the macOS 26 SDK and
        # its test binaries fail to link libSystem there (undefined
        # _clock_gettime et al). Revisit when the toolchain is bumped.
        # windows-2022 (not -latest): Zig 0.14.1's std fails to compile
        # against the windows-2025 VS2026 SDK (void params with
        # x86_64_win convention in std/c.zig). Same revisit note.
        os: [ubuntu-latest, windows-2022, macos-15]
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install SDK Node Dependencies
      run: |
        cd src/sdk/ts
        npm ci

    - name: Check Zig formatting
      run: zig fmt --check src/ build.zig

    - name: Run Zig unit tests
      run: zig build test

    - name: Typecheck and unit-test TypeScript SDK
      run: |
        cd src/sdk/ts
        npm test

    - name: Fetch Windows node.lib for N-API link
      # lib/node.lib is deliberately untracked (lean repo) but required by
      # build.zig to link the addon on Windows. Fetch the exact matching
      # import library from the official Node.js distribution.
      if: runner.os == 'Windows'
      run: |
        New-Item -ItemType Directory -Force lib | Out-Null
        $NodeVersion = (node -v).TrimStart('v')
        Invoke-WebRequest -Uri "https://nodejs.org/dist/v$NodeVersion/win-x64/node.lib" -OutFile "lib/node.lib"

    - name: Build Zig Core (ReleaseSafe)
      run: zig build -Doptimize=ReleaseSafe

    - name: Run E2E Zero-Copy Test
      run: node scripts/e2e_zerocopy_test.js

    - name: Clean stale SHM between suites
      # Suites leave differently-sized segments behind (no shm_unlink
      # ownership yet): 16MB POSIX SHM on Linux, 16MB file on macOS
      # (file-backed backend). The engine refuses size mismatches.
      # See run-e2e.js cleanStaleShm.
      if: runner.os != 'Windows'
      run: rm -f /dev/shm/TakyonDB_Master /tmp/takyondb_TakyonDB_Master ./data.takyon ./data.takyon.snap

    - name: Run Chaos Engine Benchmark
      run: node scripts/benchmark_chaos.js

    - name: Build Windows Inno Setup Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup -y
        iscc packaging/windows/installer.iss

    - name: Build Linux Debian Package (.deb)
      if: runner.os == 'Linux'
      run: |
        chmod +x packaging/linux/build_deb.sh
        cd packaging/linux && ./build_deb.sh

    - name: Build macOS Package (.pkg)
      if: runner.os == 'macOS'
      run: |
        chmod +x packaging/macos/build_pkg.sh
        cd packaging/macos && ./build_pkg.sh

    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: installers-${{ matrix.os }}
        path: |
          packaging/windows/Output/*.exe
          packaging/linux/*.deb
          packaging/macos/*.pkg
          zig-out/bin/*
          zig-out/lib/*

  pack-smoke:
    name: Pack & install smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same OS/arch pairing as the installer matrix, so the prebuild that
        # pack_smoke assembles is the one the release job would publish.
        os: [ubuntu-latest, windows-2022, macos-15]
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install SDK Node Dependencies
      run: cd src/sdk/ts && npm ci

    - name: Fetch Windows node.lib for N-API link
      if: runner.os == 'Windows'
      run: |
        New-Item -ItemType Directory -Force lib | Out-Null
        $NodeVersion = (node -v).TrimStart('v')
        Invoke-WebRequest -Uri "https://nodejs.org/dist/v$NodeVersion/win-x64/node.lib" -OutFile "lib/node.lib"

    - name: Build daemon and N-API addon
      run: zig build -Doptimize=ReleaseSafe

    - name: Pack the package and install it clean, then use it
      # The gate that proves "installable". Nothing else in CI ever
      # installed the published tarball, which is how a package that ships no
      # native addon could look green.
      timeout-minutes: 10
      run: node scripts/pack_smoke.js

  release:
    name: Create GitHub Release & Publish to NPM
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble per-platform prebuilds into the package
        # `npm install takyondb` used to ship no native code at all, so the
        # documented quickstart could not run. The addon is N-API, so one
        # binary per platform+arch serves every Node release: copy the
        # takyondb_bridge.node from each OS artifact into the layout that
        # src/sdk/client/addon.ts searches (prebuilds/<platform>-<arch>/).
        # Runner -> prebuild key:
        #   ubuntu-latest  (x64)  -> linux-x64
        #   macos-15       (arm64)-> darwin-arm64
        #   windows-2022   (x64)  -> win32-x64
        # linux-arm64 and darwin-x64 have no runner in this matrix; loadBindings()
        # reports them as unsupported instead of failing at require time.
        run: |
          set -euo pipefail
          PKG=src/sdk/ts
          map_artifact() {
            artifact="$1"; key="$2"
            src="release-artifacts/${artifact}/zig-out/bin/takyondb_bridge.node"
            if [ ! -f "$src" ]; then
              echo "::error::missing ${src} (artifact '${artifact}')"
              return 1
            fi
            mkdir -p "${PKG}/prebuilds/${key}"
            cp "$src" "${PKG}/prebuilds/${key}/takyondb_bridge.node"
            echo "assembled prebuilds/${key}/takyondb_bridge.node ($(stat -c%s "${PKG}/prebuilds/${key}/takyondb_bridge.node" 2>/dev/null || wc -c < "${PKG}/prebuilds/${key}/takyondb_bridge.node") bytes)"
          }
          map_artifact installers-ubuntu-latest  linux-x64
          map_artifact installers-macos-15       darwin-arm64
          map_artifact installers-windows-2022   win32-x64
          find "${PKG}/prebuilds" -type f -exec file {} \;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build TypeScript SDK
        run: |
          cd src/sdk/ts
          npm ci
          npm run build

      - name: Verify the tarball carries the prebuilds
        # Fail before publishing rather than after: a tarball that installs
        # but cannot load its addon is the exact defect this is closing.
        run: |
          set -euo pipefail
          cd src/sdk/ts
          npm pack --dry-run > /tmp/pack.txt 2>&1 || { cat /tmp/pack.txt; exit 1; }
          cat /tmp/pack.txt
          for key in linux-x64 darwin-arm64 win32-x64; do
            grep -q "prebuilds/${key}/takyondb_bridge.node" /tmp/pack.txt \
              || { echo "::error::prebuilds/${key} missing from the tarball"; exit 1; }
          done
          grep -q "dist/client/addon.js" /tmp/pack.txt \
            || { echo "::error::the addon loader is missing from the tarball"; exit 1; }

      - name: Publish Package to NPM
        run: |
          cd src/sdk/ts
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*

