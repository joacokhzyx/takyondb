name: TakyonDB CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast false: every OS reports even when another fails.
      fail-fast: false
      matrix:
        # macos-15 (not -latest): Zig 0.14.1 predates the macOS 26 SDK and
        # its test binaries fail to link libSystem there (undefined
        # _clock_gettime et al). Revisit when the toolchain is bumped.
        os: [ubuntu-latest, windows-latest, macos-15]
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install SDK Node Dependencies
      run: |
        cd src/sdk/ts
        npm ci

    - name: Check Zig formatting
      run: zig fmt --check src/ build.zig

    - name: Run Zig unit tests
      run: zig build test

    - name: Typecheck and unit-test TypeScript SDK
      run: |
        cd src/sdk/ts
        npm test

    - name: Build Zig Core (ReleaseSafe)
      run: zig build -Doptimize=ReleaseSafe

    - name: Run E2E Zero-Copy Test
      run: node scripts/e2e_zerocopy_test.js

    - name: Run Chaos Engine Benchmark
      run: node scripts/benchmark_chaos.js

    - name: Build Windows Inno Setup Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup -y
        iscc packaging/windows/installer.iss

    - name: Build Linux Debian Package (.deb)
      if: runner.os == 'Linux'
      run: |
        chmod +x packaging/linux/build_deb.sh
        cd packaging/linux && ./build_deb.sh

    - name: Build macOS Package (.pkg)
      if: runner.os == 'macOS'
      run: |
        chmod +x packaging/macos/build_pkg.sh
        cd packaging/macos && ./build_pkg.sh

    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: installers-${{ matrix.os }}
        path: |
          packaging/windows/Output/*.exe
          packaging/linux/*.deb
          packaging/macos/*.pkg
          zig-out/bin/*
          zig-out/lib/*

  release:
    name: Create GitHub Release & Publish to NPM
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Build TypeScript SDK
        run: |
          cd src/sdk/ts
          npm ci
          npm run build

      - name: Publish Package to NPM
        run: |
          cd src/sdk/ts
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*

