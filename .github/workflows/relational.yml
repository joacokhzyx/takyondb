name: Relational Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  relational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install SDK deps
        run: |
          cd src/sdk/ts
          npm ci
      - name: Check Zig formatting (incl. relational)
        run: zig fmt --check src/ build.zig
      - name: Run Zig tests (incl. relational)
        run: zig build test
      - name: Build daemon and N-API addon
        run: zig build -Doptimize=ReleaseSafe
      - name: Run native scan E2E (live daemon)
        run: node scripts/e2e_scan_test.js
      - name: Run refcount E2E (shared mapping, live daemon)
        run: node scripts/e2e_refcount_test.js
      - name: Run crash-recovery E2E (SIGKILL, live daemon)
        run: node scripts/e2e_crash_auto_test.js
      - name: Run corruption E2E (torn write, live daemon)
        run: |
          cd scripts
          NODE_PATH=../src/sdk/ts/node_modules node -r ts-node/register/transpile-only e2e_corruption_test.ts
      - name: Run native scan bench (live daemon, informational)
        run: node scripts/bench_scan.js 3000
      - name: Run TS relational unit tests
        run: |
          cd src/sdk/ts
          npm run test:unit -- ../client/relational
      - name: Build SDK dist (required by benches)
        run: |
          cd src/sdk/ts
          npm run build
      - name: Run catalog-reboot E2E (DDL via __catalog__, SIGKILL)
        run: node scripts/e2e_catalog_reboot_test.js
      - name: Run relational bench (seeded TS engine, gate)
        run: node scripts/bench_relational.js
